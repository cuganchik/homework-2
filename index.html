<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ночь в музее</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="card">
      <h1 id="event-title">Ночь в музее</h1>
      <p>15 ноября, 18:30</p>
      <p>Музей космонавтики, проспект Мира, 111</p>
      <p>Вечерняя программа с выставкой и экскурсиями</p>

      <button id="show-program" type="button">Показать программу</button>
      <div id="program" class="message" hidden></div>
      <div id="data-error" class="error" hidden></div>
    </main>

    <form id="service-form" class="services" hidden>
      <h2>Дополнительные услуги</h2>
      <p><label><input id="guide" type="checkbox"> Экскурсия с гидом</label></p>
      <p><label><input id="audio" type="checkbox"> Аудиогид</label></p>
      <p><label><input id="catalog" type="checkbox"> Каталог выставки</label></p>
      <button type="submit">Рассчитать стоимость</button>
    </form>

    <div id="choice-error" class="error" hidden></div>
    <div id="result" class="result" hidden></div>
    <div id="report-json" class="json" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
